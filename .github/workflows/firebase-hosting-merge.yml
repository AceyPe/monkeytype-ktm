name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - contest-mode
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
